
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenChess Academy — Rule Tests</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 30px auto;
      padding: 16px;
      background: #101820;
      color: #f5f7fa;
    }
    li { margin: 12px 0; }
    .pass { color: #86efac; }
    .fail { color: #fca5a5; }
  </style>
</head>
<body>
  <h1>OpenChess Academy</h1>
  <h2>Chess Rule Test Suite</h2>
  <p id="summary">Running tests…</p>
  <ol id="results"></ol>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    const results = document.getElementById("results");
    const summary = document.getElementById("summary");
    let passed = 0;
    let failed = 0;

    function test(name, check) {
      const item = document.createElement("li");
      try {
        if (!check()) throw new Error("Expected condition was not met.");
        item.textContent = "PASS — " + name;
        item.className = "pass";
        passed++;
      } catch (error) {
        item.textContent = "FAIL — " + name + ": " + error.message;
        item.className = "fail";
        failed++;
      }
      results.appendChild(item);
    }

    if (typeof Chess === "undefined") {
      summary.textContent =
        "Chess library failed to load. Check your internet connection.";
    } else {
      test("Initial position contains 20 legal moves", () => {
        return new Chess().moves().length === 20;
      });

      test("Illegal pawn jump is rejected", () => {
        const game = new Chess();
        return game.move({ from: "e2", to: "e5" }) === null;
      });

      test("Kingside castling works", () => {
        const game = new Chess();
        [
          ["e2", "e4"], ["e7", "e5"],
          ["g1", "f3"], ["b8", "c6"],
          ["f1", "c4"], ["g8", "f6"]
        ].forEach(([from, to]) => game.move({ from, to }));

        const move = game.move({ from: "e1", to: "g1" });
        return move !== null &&
          game.get("g1").type === "k" &&
          game.get("f1").type === "r";
      });

      test("En passant captures the correct pawn", () => {
        const game = new Chess();
        [
          ["e2", "e4"], ["a7", "a6"],
          ["e4", "e5"], ["d7", "d5"]
        ].forEach(([from, to]) => game.move({ from, to }));

        const move = game.move({ from: "e5", to: "d6" });
        return move !== null &&
          move.flags.includes("e") &&
          game.get("d6").type === "p" &&
          game.get("d5") === null;
      });

      test("Fool's Mate is detected as checkmate", () => {
        const game = new Chess();
        [
          ["f2", "f3"], ["e7", "e5"],
          ["g2", "g4"], ["d8", "h4"]
        ].forEach(([from, to]) => game.move({ from, to }));

        return game.in_checkmate();
      });

      test("Promotion to a queen works", () => {
        const game = new Chess(
          "4k3/P7/8/8/8/8/8/4K3 w - - 0 1"
        );
        const move = game.move({
          from: "a7", to: "a8", promotion: "q"
        });
        return move !== null &&
          game.get("a8").type === "q";
      });

      test("Stalemate is detected", () => {
        const game = new Chess(
          "7k/5K2/6Q1/8/8/8/8/8 b - - 0 1"
        );
        return game.in_stalemate();
      });

      test("Insufficient material is detected", () => {
        const game = new Chess(
          "4k3/8/8/8/8/8/8/4K3 w - - 0 1"
        );
        return game.insufficient_material();
      });

      summary.textContent =
        `${passed} passed; ${failed} failed.`;
    }
  </script>
</body>
</html>
