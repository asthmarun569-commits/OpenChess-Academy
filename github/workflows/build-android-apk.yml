
name: Build OpenChess Academy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenChess-Academy-Android-APK-Source.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o OpenChess-Academy-Android-APK-Source.zip 'android-app/*' -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android-app assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenChess-Academy-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
