
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenChess Academy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: #101820; color: #f5f7fa;
    }
    header { padding: 24px 16px; text-align: center; }
    header h1 { margin: 0 0 8px; }
    main { width: min(920px, 100%); margin: auto; padding: 12px; }
    .layout { display: grid; grid-template-columns: minmax(260px, 520px) 1fr; gap: 20px; }
    #board { display: grid; grid-template-columns: repeat(8, 1fr); border: 4px solid #344451; }
    .square {
      aspect-ratio: 1; display: grid; place-items: center;
      border: 0; padding: 0; font-size: clamp(22px, 6vw, 48px);
      cursor: pointer; position: relative;
    }
    .light { background: #f0d9b5; }
    .dark { background: #b58863; }
    .selected { outline: 4px solid #facc15; outline-offset: -4px; }
    .target::after { content: ""; width: 22%; height: 22%; border-radius: 50%; background: #237444; position: absolute; opacity: .8; }
    .piece { line-height: 1; }
    .panel { background: #1d2a35; border-radius: 12px; padding: 16px; }
    button.action { padding: 10px 14px; margin: 4px 4px 4px 0; border-radius: 8px; border: 1px solid #526576; background: #263b4b; color: white; cursor: pointer; }
    #status { min-height: 48px; line-height: 1.5; }
    #moves { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
    @media (max-width: 650px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>♟ OpenChess Academy</h1>
    <p>Learn chess. Practice tactics. Improve every move.</p>
  </header>
  <main>
    <div class="layout">
      <section>
        <div id="board" aria-label="Chessboard"></div>
        <p id="status" role="status">Loading chess game…</p>
        <button class="action" id="undo">Undo</button>
        <button class="action" id="restart">Restart</button>
      </section>
      <aside class="panel">
        <h2>Move history</h2>
        <div id="moves">No moves yet.</div>
        <hr>
        <h2>Academy roadmap</h2>
        <p>1. Legal chess moves</p>
        <p>2. Computer opponents</p>
        <p>3. Lessons and puzzles</p>
        <p>4. Online multiplayer and ratings</p>
        <p><small>Some roadmap features are not implemented yet.</small></p>
      </aside>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.4.0/chess.min.js"></script>
  <script>
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const movesBox = document.querySelector("#moves");
    const game = new Chess();
    let selected = null;
    let destinations = [];

    const glyph = {
      wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
      bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
    };

    function render() {
      board.replaceChildren();
      const legal = game.moves({ verbose: true });
      destinations = selected ? legal.filter(m => m.from === selected).map(m => m.to) : [];

      for (let rank = 8; rank >= 1; rank--) {
        for (let file = 0; file < 8; file++) {
          const square = "abcdefgh"[file] + rank;
          const piece = game.get(square);
          const cell = document.createElement("button");
          cell.className = "square " + ((rank + file) % 2 ? "dark" : "light");
          cell.setAttribute("aria-label", square + (piece ? " " + piece.color + " " + piece.type : ""));
          if (square === selected) cell.classList.add("selected");
          if (destinations.includes(square)) cell.classList.add("target");
          const span = document.createElement("span");
          span.className = "piece";
          span.textContent = piece ? glyph[piece.color + piece.type.toUpperCase()] : "";
          cell.append(span);
          cell.addEventListener("click", () => clickSquare(square));
          board.append(cell);
        }
      }

      const history = game.history();
      movesBox.textContent = history.length
        ? Array.from({length: Math.ceil(history.length / 2)}, (_, i) =>
            (i + 1) + ". " + history.slice(i * 2, i * 2 + 2).join(" ")
          ).join("\n")
        : "No moves yet.";

      if (game.isCheckmate()) status.textContent = "Checkmate. " + (game.turn() === "w" ? "Black" : "White") + " wins.";
      else if (game.isDraw()) status.textContent = "Draw.";
      else status.textContent = (game.turn() === "w" ? "White" : "Black") + " to move" + (game.isCheck() ? " — check!" : "") + ".";
    }

    function clickSquare(square) {
      if (selected && destinations.includes(square)) {
        try {
          const piece = game.get(selected);
          const promotion = piece && piece.type === "p" && (square.endsWith("8") || square.endsWith("1"))
            ? (prompt("Promote to q, r, b, or n:", "q") || "q").toLowerCase()
            : undefined;
          game.move({ from: selected, to: square, promotion });
          selected = null;
          render();
          return;
        } catch (e) {}
      }

      const piece = game.get(square);
      if (piece && piece.color === game.turn()) selected = square;
      else selected = null;
      render();
    }

    document.querySelector("#undo").addEventListener("click", () => {
      game.undo(); selected = null; render();
    });
    document.querySelector("#restart").addEventListener("click", () => {
      game.reset(); selected = null; render();
    });

    if (typeof Chess !== "undefined") render();
    else status.textContent = "Chess rules library failed to load. Check your internet connection.";
  </script>
</body>
</html>
